spring.datasource.url=jdbc:h2:mem:eventtest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# This file shadows src/main/resources/application.properties during tests
app.jwt.secret=test-only-jwt-secret-key-for-evege-college-event-manager-0123456789
app.jwt.expiration-ms=86400000
