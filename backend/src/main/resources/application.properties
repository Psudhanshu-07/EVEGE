server.port=${PORT:8082}
spring.application.name=college-event-manager

# PostgreSQL. Connects to primary local PostgreSQL (port 5432, database evege_db).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evege_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:PandeyS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Ensure the dedicated student table is created in evege_db on every deployment.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT (HMAC-SHA256)
app.jwt.secret=${APP_JWT_SECRET:evege-college-event-manager-jwt-secret-key-0123456789abcdef}
app.jwt.expiration-ms=86400000
